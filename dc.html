<body>

  <!-- Pas de pré-roll boot sur cette page (contrainte 2) : le DC est une
       page de consultation, pas une entrée de site. -->

  <canvas id="bg-net" aria-hidden="true"></canvas>

  <nav class="topbar no-print">
    <a class="brand" href="index.html"><span class="prompt-sign">&gt;</span> kevin.arnoud<span class="prompt-sign">_</span></a>

      <span class="kbd-label">naviguer</span> <kbd>Ctrl</kbd><kbd>K</kbd>

  </nav>

  <main class="wrap" id="dc">

  <div id="palette-overlay" role="dialog" aria-modal="true" aria-label="Navigation rapide">

      <div id="palette-input-row">
        <span class="prompt-sign">&gt;</span>
        <input id="palette-input" type="text" placeholder="chercher un projet, une page…" autocomplete="off" spellcheck="false">

      <div id="palette-list" role="listbox"></div>
      <div id="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> naviguer</span>
        <span><kbd>Entrée</kbd> ouvrir</span>
        <span><kbd>Échap</kbd> fermer</span>
      </div>
    </div>
  </div>

  <footer>
    <span>© 2026 Kevin Arnoud — construit à la main, hébergé sur GitHub Pages</span>
    <span id="dc-meta" class="mono"><!-- meta.version + meta.dateMaj injectés --></span>
